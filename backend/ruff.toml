line-length = 120
target-version = "py311"

[lint]
# Pyflakes, syntax errors, bugbear (likely bugs) and async pitfalls.
select = ["F", "E9", "B", "ASYNC"]
# Timeouts are passed through to provider SDKs and httpx, which enforce them; asyncio.timeout
# wrappers would duplicate that.
ignore = ["ASYNC109"]
